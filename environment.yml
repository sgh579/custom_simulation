name: palpation
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - matplotlib>=3.8
  - plotly>=6
  - pyvista>=0.45
  - vtk>=9.3
  - pyvistaqt>=0.11
  - pyside6>=6.7
  - scikit-image>=0.23
  - scikit-learn>=1.5
  - pyqtgraph>=0.13
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.nvidia.com/
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - torchaudio==2.11.0+cu128
      - warp-lang>=1.14.0rc2
